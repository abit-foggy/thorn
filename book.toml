[book]
authors = ["The Thorn Developers"]
language = "en"
src = "src"
title = "The Thorn Reference"

[output.html]
git-repository-url = "https://github.com/abit-foggy/thorn"
default-theme = "rust"
preferred-dark-theme = "coal"
additional-css = ["theme/custom.css"]
additional-js = ["theme/pith-highlight.js"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
