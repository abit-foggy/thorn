name: Stable Release

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout thorn
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libelf-dev libssl-dev bc bison flex build-essential
          git clone --depth 1 https://github.com/michaelforney/samurai /tmp/samurai
          make -C /tmp/samurai
          sudo install -m 755 /tmp/samurai/samu /usr/local/bin/samu

      - name: Build and Install Vendored Pith & QBE
        run: |
          make -C vendor/pith
          sudo install -m 755 vendor/pith/pith /usr/local/bin/pith
          sudo mkdir -p /usr/local/lib/pith/runtime
          sudo install -m 644 vendor/pith/runtime/libruntime.a /usr/local/lib/pith/runtime/libruntime.a
          sudo mkdir -p /usr/local/lib/pith/tcc/include
          sudo cp -r vendor/pith/vendor/tcc/include/* /usr/local/lib/pith/tcc/include/
          if [ -f vendor/pith/vendor/tcc/libtcc1.a ]; then
            sudo install -m 644 vendor/pith/vendor/tcc/libtcc1.a /usr/local/lib/pith/tcc/libtcc1.a
          fi
          make -C vendor/pith/vendor/qbe
          sudo install -m 755 vendor/pith/vendor/qbe/qbe /usr/local/bin/qbe

      - name: Build Thorn
        run: make

      - name: Run Verification Suite
        run: ./tests/verify.sh

      - name: Package Stable Artifacts
        run: |
          mkdir -p dist
          install -m 0755 out/thorn dist/thorn
          STAGE="thorn-x86_64-linux"
          mkdir -p "$STAGE/include"
          install -m 0755 out/thorn "$STAGE/thorn"
          if [ -f out/artifacts/thorn_core.a ]; then
            install -m 0644 out/artifacts/thorn_core.a "$STAGE/libthorn_core.a"
          fi
          install -m 0644 src/include/*.h "$STAGE/include/"
          install -m 0644 LICENSE "$STAGE/LICENSE" 2>/dev/null || true
          install -m 0644 README.md "$STAGE/README.md" 2>/dev/null || true
          tar -czf "dist/thorn-x86_64-linux.tar.gz" -C "$STAGE" .
          rm -rf "$STAGE"

      - name: Upload Stable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-stable
          path: dist/*

  release:
    name: publish stable release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "thorn" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prune Non-stable Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for asset in $(gh release view stable --json assets --jq '.assets[].name' 2>/dev/null || true); do
            case "$asset" in
              thorn|*.tar.gz|SHA256SUMS.txt) ;;
              *)
                echo "Removing obsolete release asset: $asset"
                gh release delete-asset stable "$asset" -y || true
                ;;
            esac
          done

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: stable
          name: "Thorn Stable Release"
          prerelease: false
          draft: false
          make_latest: true
          body: |
            Official rolling stable release for Thorn.

            ### Quick Install
            ```bash
            # Change TAG=stable to TAG=nightly for the nightly build
            curl -fsSL https://raw.githubusercontent.com/abit-foggy/thorn/main/install.sh | TAG=stable bash
            ```

            ### Verification
            Verify downloaded archive/binary integrity using the included `SHA256SUMS.txt`:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          files: |
            release-assets/*
